# fly.toml app configuration file for Pochi 1v1 Battle Server
app = "pochipochi-battle"
primary_region = "syd"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "4001"
  NODE_ENV = "production"

[http_service]
  internal_port = 4001
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [http_service.concurrency]
    type = "connections"
    hard_limit = 1000
    soft_limit = 800

[[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  grace_period = "5s"
  method = "GET"
  path = "/healthz"
